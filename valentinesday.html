<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine?</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      overflow: hidden;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 330px;
      text-align: center;
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      position: relative;
    }

    h1 {
      font-size: clamp(22px, 5vw, 28px);
      color: #e63946;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      font-size: clamp(16px, 4vw, 18px);
      padding: 12px 24px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      min-width: 120px;
    }

    #yesBtn {
      background-color: #e63946;
      color: white;
    }

    #noBtn {
      background-color: #ccc;
      position: relative;
      transition: transform 0.15s ease;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Niktha, will you be my Valentine? 💖</h1>

    <div class="buttons">
      <button id="yesBtn" onclick="goToLovePage()">Yes ❤️</button>
      <button id="noBtn">No 😢</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");

    function moveNo() {
      const x = Math.random() * 120 - 60; // left/right
      const y = Math.random() * 80 - 40;  // up/down
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }

    // Desktop hover
    noBtn.addEventListener("mouseover", moveNo);

    // Mobile touch
    noBtn.addEventListener("touchstart", moveNo);

    function goToLovePage() {
      window.location.href = "love.html";
    }
  </script>

</body>
</html>
